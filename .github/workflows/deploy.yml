name: Deploy Dashboard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets
        run: |
          sed -i "s|%%PIPEDRIVE_TOKEN%%|${{ secrets.PIPEDRIVE_TOKEN }}|g" index.html
          sed -i "s|%%APP_USERNAME%%|${{ secrets.APP_USERNAME }}|g" index.html
          sed -i "s|%%APP_PASSWORD%%|${{ secrets.APP_PASSWORD }}|g" index.html

      - name: Add no-cache headers
        run: |
          cat > staticwebapp.config.json << 'EOF'
          {
            "globalHeaders": {
              "cache-control": "no-cache, no-store, must-revalidate"
            }
          }
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          force_orphan: true
